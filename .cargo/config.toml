# Cargo Configuration for URAE Algebra Engine
[target.wasm32-unknown-unknown]
rustflags = [
    # 1. Hardware SIMD128 instruction emission
    "-C", "target-feature=+simd128,+bulk-memory,+mutable-globals,+nontrapping-fptoint,+sign-ext",

    # 2. WASM Stack Size Allocation (2MB headroom for complex AST evaluation and recursion)
    "-C", "link-arg=-zstack-size=2097152",
]

